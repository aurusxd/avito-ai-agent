services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/avito.db
      PANEL_API_TOKEN: ${PANEL_API_TOKEN:-dev-panel-token}
      CORS_ORIGINS: '["http://localhost:3000"]'
      AVITO_HEADLESS: ${AVITO_HEADLESS:-false}
      BROWSER_NO_SANDBOX: ${BROWSER_NO_SANDBOX:-true}
      BROWSER_DISABLE_DEV_SHM: ${BROWSER_DISABLE_DEV_SHM:-false}
    volumes:
      - sqlite-data:/app/data
    shm_size: 1gb
    ports:
      - "${BACKEND_PORT:-8080}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build: ./frontend
    environment:
      API_BASE_URL: http://backend:8000
      ORIGIN: ${PANEL_ORIGIN:-http://localhost:3000}
    ports:
      - "${PANEL_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sqlite-data:
